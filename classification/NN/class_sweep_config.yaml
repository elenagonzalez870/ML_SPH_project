program: NN_classification.py
method: bayes
run_cap: 200
project: ML_SPH_NN_Classification
metric:
  goal: maximize
  name: val_balanced_acc
parameters:
  model:
    parameters:
      inputs:
        value: 5
      labels:
        value: 4
      width:
        value: [512, 256, 128]
      layers:
        value: 3
      activation_function:
        value: "relu"
      model_type:
        value: "mlp"
      layer_norm:
        value: True
  
  training:
    parameters:
      epochs:
        values: [500, 1000, 2000]
      learning_rate:
        distribution: log_uniform_values
        max: 0.1
        min: 0.00001
      min_lr:
        value: 0.00000001
      scheduler:
        values: ["CosineAnnealingLR", "ReduceLROnPlateau"]
      optimizer:
        values: ["sgd", "adamw"]
      scheduler_factor:
        values: [0.3, 0.4, 0.5]
      scheduler_patience:
        values: [10, 20, 40, 60]
      weight_decay:
        value: 0.01
      validation:
        value: True
      loss_function:
        value: "CrossEntropyLoss"
      loss_type:
        value: "Normal"
  
  data:
    parameters:
      dataset:
        value: "data_splits_splot22f_1215.npz"
      age_transform:
        value: "log10(x+0.001)"
      v_transform:
        value: "log10(x+10)"
      rp_transform:
        value: "log10(x+0.1)"
      m1i_transform:
        value: "ln(x)"
      m2i_transform:
        value: "ln(x)"
      label_transform:
        value: False
      train_size:
        value: 0.7
      val_size:
        value: 0.15
      test_size:
        value: 0.15
      stratify:
        value: True
      random_state:
        value: 42
      standard_normalization_input:
        value: True
      standard_normalization_labels:
        value: False
      batch_size:
        values: [64, 128, 256]
      val_batch_size:
        value: 'train'
      test_batch_size:
        value: 'all'